[pytest]
# Offline prosthetic-leg acquisition, safety, analysis and frozen Greedy regression.
addopts = -ra --strict-config
pythonpath = .
cache_dir = .cache/pytest-core
testpaths =
    tests/test_mainline.py
    tests/test_original_training_adapter.py
    tests/test_tcp_force_training.py
    tests/test_realtime_link_diagnostic.py
    tests/test_restore_session_tcp.py
    tests/test_force_trial_ledger.py
    tests/test_manual_leg_check.py
    tests/test_wrench_endpoints.py
    tests/test_twincat_file_evidence.py
    tests/test_record_rehab_trajectory.py
    tests/test_preview_recorded_trajectory.py
    tests/test_review_empty_recording.py
